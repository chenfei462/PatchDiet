version: 1
base: origin/main
language: generic
commands:
  required:
    - npm test
  optional: []
reduction:
  strategy: conservative
  atom_granularity: hunk
  max_runtime_minutes: 20
  retry_flaky_tests: 2
scope:
  ignore_paths:
    - dist/**
report:
  html: true
  markdown: true
  github_comment: true
safety:
  mode: local
  allow_upload: false
intelligence:
  mode: local-only
performance:
  max_parallel_worktrees: 1
  cache_tests: false