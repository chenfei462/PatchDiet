name: PatchDiet
description: Shrink AI-generated pull requests into smaller reviewable patches.
inputs:
  base:
    description: Base git ref. Defaults to GitHub PR base, origin/main, origin/master, then upstream merge-base.
    required: false
  head:
    description: Head git ref. Defaults to HEAD.
    required: false
    default: HEAD
  test:
    description: Required check command. Defaults to detected package or language test command.
    required: false
  github-token:
    description: Token for posting or updating PR comments. Falls back to step summary when permissions are unavailable.
    required: false
runs:
  using: node20
  main: packages/action/dist/index.mjs
