name: PatchDiet
description: Shrink AI-generated pull requests into smaller reviewable patches.
inputs:
  base:
    description: Base git ref
    required: true
  head:
    description: Head git ref
    required: false
    default: HEAD
  test:
    description: Optional required check command override. When omitted, PatchDiet auto-detects supported root JS repos and otherwise requires explicit commands.
    required: false
  lint:
    description: Optional lint command that must not get worse when green at baseline
    required: false
  typecheck:
    description: Optional typecheck command that must not get worse when green at baseline
    required: false
  github-token:
    description: Token for posting PR comments
    required: false
runs:
  using: node20
  main: packages/action/index.mjs
