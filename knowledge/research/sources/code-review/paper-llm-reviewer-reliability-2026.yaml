study:
  question: Do models judge natural-language requirement conformance reliably, and how do prompting, rationales and
    executable filtering affect errors?
  datasets:
    - HumanEval-X-Bugs paired canonical/buggy Python functions
    - MBPP paired with reconstructed buggy variants
    - QuixBugs corrected/defective pairs
  models:
    - GPT-4o
    - Claude-4.5-sonnet
    - Google Gemini-2.0-flash
    - meta-llama/llama-3.1-8b-instruct
    - mistralai/mistral-small-3.1-24b-instruct
  findings: Richer prompts can increase false rejections while reducing false acceptance. Rationale consistency and fault
    awareness vary. Executable filtering reduces false rejections but can increase false acceptance.
  limitations: Small benchmark functions; label and test adequacy; GPT-4o rationale evaluator and augmented tests; no
    industrial PR generalization or exhaustive correctness proof.
