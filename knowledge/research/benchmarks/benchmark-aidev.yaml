data_use_constraints: Publisher metadata license is not blanket authorization over included source code, review text,
  personal data or container dependencies. Per-selected-record license/terms and minimization review required before
  import. Official card explicitly says original files/patches retain repository licenses and users must verify specific
  repository/file licenses.
redistribution_limits: No raw dataset, patches, review/user text or images redistributed by PatchDiet.
  Attribution/notices and upstream license compatibility remain unreviewed for any selected sample.
privacy_constraints: Public availability is not consent for arbitrary reuse. Identity/comment/issue text requires
  minimization, secret/PII screening, restricted access and a deletion/retention process; no approved record-level
  privacy review exists. Card reports PII removed from user table, but usernames, PR/review bodies and linkage still
  require downstream reidentification/content review.
sampling_limitations: Public GitHub agent attribution via known accounts/signatures and collection heuristics;
  popular-repository enriched subset differs from all-PR population. Attribution misses unrecognized/private work; star
  thresholds, agent detection and crawl dates induce selection bias. Current v5 card is later than inspected 2026 v1
  paper; do not mix populations.
repository_level_code_licensing: Per-repository and per-file at source snapshot must be reviewed; dataset/harness
  license cannot replace upstream rights.
environment_methodology: Observational PR/comment/review/commit/user/repository tables, not a ready executable test
