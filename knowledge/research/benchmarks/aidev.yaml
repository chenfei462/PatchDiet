id: aidev
name: aidev
source: benchmark:aidev
task_shape: Public GitHub agent attribution via known accounts/signatures and collection heuristics; popular-repository
  enriched subset differs from all-PR population. Attribution misses unrecognized/private work; star thresholds, agent
  detection and crawl dates induce selection bias. Current v5 card is later than inspected 2026 v1 paper; do not mix
  populations.
verification: SOURCE_PARTIALLY_VERIFIED; canonical source card holds current evidence and HOLD legal gate.
