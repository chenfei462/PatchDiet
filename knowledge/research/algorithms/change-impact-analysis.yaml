name: change-impact-analysis
family: dependency-analysis
original_sources: []
problem: Estimate which tests, symbols, and files may be affected by a change.
input: Before/after graphs and changed nodes.
output: Impact set for targeted verification and review routing.
algorithm: Map changed nodes into the dependency graph and traverse affected relationships.
pseudocode: |
  changed = map_diff_to_symbols(diff)
  impact = closure(changed, dependency_edges)
  return impact
complexity: O(V + E) after graph construction.
oracle_calls: None for analysis; selected and full tests remain executable gates.
termination: Finite graph closure.
correctness_scope: Conservative only if graph is complete and edge semantics are sound.
assumptions:
  - diff-to-symbol mapping
  - graph completeness
failure_modes: &a1
  - unresolved references
  - generated code
  - stale index
known_variants:
  - dynamic impact
  - change propagation
  - regression selection
patchdiet_current_state: packages/evidence and packages/scope implement lightweight evidence and scope maps.
patchdiet_gap: No benchmark against optional SCIP import or hidden regressions.
recommended_use: Targeted-first verification with mandatory full verification.
not_recommended_for: Skipping required checks based on an incomplete impact set.
tests_required:
  - cross-file edge
  - deleted symbol
  - stale index invalidation
benchmark_metrics:
  - impact precision/recall
  - targeted runtime
  - hidden regression rate
unverified_legacy_citations:
  - paper:horwitz-reps-binkley-1990
provenance_gap: Original primary source not verified; legacy algorithm text is quarantined and may not inform experiments.
status: NOT_VERIFIED
independent_review: PENDING
